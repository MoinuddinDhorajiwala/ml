
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #222222;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 360px;
            padding: 12px;
        }

        .practical {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 8px;
            border-bottom: 1px solid #eeeeee;
        }

        .practical-name {
            font-size: 13px;
            font-weight: 500;
        }

        .copy-button {
            flex-shrink: 0;
            padding: 5px 10px;
            border: 1px solid #dddddd;
            border-radius: 5px;
            background: #f7f7f7;
            color: #333333;
            font: 12px Arial, sans-serif;
            cursor: pointer;
        }

        .copy-button:hover {
            background: #eeeeee;
        }

        .copy-button:focus-visible {
            outline: 2px solid #777777;
            outline-offset: 2px;
        }
    </style>
</head>

<body>
    <main class="container">

        <div class="practical">
            <span class="practical-name">SVM</span>
            <button class="copy-button" data-code="SVM">Copy</button>
        </div>

        <div class="practical">
            <span class="practical-name">Logistic Regression</span>
            <button class="copy-button" data-code="Logistic Regression">Copy</button>
        </div>

        <div class="practical">
            <span class="practical-name">Bagging Classifier</span>
            <button class="copy-button" data-code="Bagging Classifier">Copy</button>
        </div>

        <div class="practical">
            <span class="practical-name">Multivariate Linear Regression</span>
            <button class="copy-button" data-code="Multivariate Linear Regression">Copy</button>
        </div>

    </main>

    <script>
        // Complete Python code from the four notebook cells.
        // JSON.stringify preserves indentation and line breaks.

        const practicalCodes = {
            "SVM": "# MACHINE LEARNING PRACTICALS\n# Install if required:\n# pip install numpy pandas matplotlib scikit-learn\n\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.pipeline import make_pipeline\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.svm import SVC\nfrom sklearn.metrics import (\n    accuracy_score, classification_report, confusion_matrix,\n    mean_squared_error, r2_score\n)\n\nnp.random.seed(42)\nclassification_data = []\n\nfor i in range(200):\n    study_hours = np.random.uniform(1, 10)\n    attendance = np.random.uniform(30, 100)\n\n    # A little noise makes the synthetic data less perfectly separable.\n    score = study_hours + attendance / 20 + np.random.normal(0, 0.8)\n    passed = int(score >= 7)\n\n    classification_data.append([study_hours, attendance, passed])\n\nclassification_df = pd.DataFrame(\n    classification_data,\n    columns=[\"StudyHours\", \"Attendance\", \"Passed\"]\n)\n\nX_class = classification_df[[\"StudyHours\", \"Attendance\"]]\ny_class = classification_df[\"Passed\"]\n\nXc_train, Xc_test, yc_train, yc_test = train_test_split(\n    X_class, y_class,\n    test_size=0.2,\n    random_state=42,\n    stratify=y_class\n)\n\n\ndef plot_actual_vs_predicted(y_true, y_pred, title):\n    actual = np.asarray(y_true)\n    predicted = np.asarray(y_pred)\n\n    plt.figure(figsize=(10, 4))\n\n    plt.subplot(1, 2, 1)\n    plt.scatter(range(len(actual)), actual, edgecolors=\"black\")\n    plt.title(\"Actual Values\")\n    plt.xlabel(\"Sample Number\")\n    plt.ylabel(\"Target\")\n\n    plt.subplot(1, 2, 2)\n    plt.scatter(range(len(predicted)), predicted, edgecolors=\"black\")\n    plt.title(\"Predicted Values\")\n    plt.xlabel(\"Sample Number\")\n    plt.ylabel(\"Target\")\n\n    plt.suptitle(title)\n    plt.tight_layout()\n    plt.show()\n\nsvm_model = make_pipeline(\n    StandardScaler(),\n    SVC(kernel=\"linear\")\n)\nsvm_model.fit(Xc_train, yc_train)\nsvm_pred = svm_model.predict(Xc_test)\n\nprint(\"\\n===== SVM =====\")\nprint(\"Accuracy:\", accuracy_score(yc_test, svm_pred))\nprint(classification_report(yc_test, svm_pred, zero_division=0))\nplot_actual_vs_predicted(yc_test, svm_pred, \"SVM: Actual vs Predicted\")",

            "Logistic Regression": "# MACHINE LEARNING PRACTICALS\n# Install if required:\n# pip install numpy pandas matplotlib scikit-learn\n\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.pipeline import make_pipeline\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.linear_model import LogisticRegression, LinearRegression\nfrom sklearn.metrics import (\n    accuracy_score, classification_report, confusion_matrix,\n    mean_squared_error, r2_score\n)\n\nnp.random.seed(42)\nclassification_data = []\n\nfor i in range(200):\n    study_hours = np.random.uniform(1, 10)\n    attendance = np.random.uniform(30, 100)\n\n    # A little noise makes the synthetic data less perfectly separable.\n    score = study_hours + attendance / 20 + np.random.normal(0, 0.8)\n    passed = int(score >= 7)\n\n    classification_data.append([study_hours, attendance, passed])\n\nclassification_df = pd.DataFrame(\n    classification_data,\n    columns=[\"StudyHours\", \"Attendance\", \"Passed\"]\n)\n\nX_class = classification_df[[\"StudyHours\", \"Attendance\"]]\ny_class = classification_df[\"Passed\"]\n\nXc_train, Xc_test, yc_train, yc_test = train_test_split(\n    X_class, y_class,\n    test_size=0.2,\n    random_state=42,\n    stratify=y_class\n)\n\ndef plot_actual_vs_predicted(y_true, y_pred, title):\n    actual = np.asarray(y_true)\n    predicted = np.asarray(y_pred)\n\n    plt.figure(figsize=(10, 4))\n\n    plt.subplot(1, 2, 1)\n    plt.scatter(range(len(actual)), actual, edgecolors=\"black\")\n    plt.title(\"Actual Values\")\n    plt.xlabel(\"Sample Number\")\n    plt.ylabel(\"Target\")\n\n    plt.subplot(1, 2, 2)\n    plt.scatter(range(len(predicted)), predicted, edgecolors=\"black\")\n    plt.title(\"Predicted Values\")\n    plt.xlabel(\"Sample Number\")\n    plt.ylabel(\"Target\")\n\n    plt.suptitle(title)\n    plt.tight_layout()\n    plt.show()\n\nlog_model = make_pipeline(\n    StandardScaler(),\n    LogisticRegression(max_iter=1000, random_state=42)\n)\nlog_model.fit(Xc_train, yc_train)\nlog_pred = log_model.predict(Xc_test)\nprint(\"\\n===== LOGISTIC REGRESSION =====\")\nprint(\"Accuracy:\", accuracy_score(yc_test, log_pred))\nprint(\"Confusion Matrix:\\n\", confusion_matrix(yc_test, log_pred))\nplot_actual_vs_predicted(\n    yc_test, log_pred, \"Logistic Regression: Actual vs Predicted\"\n)\n",

            "Bagging Classifier": "# MACHINE LEARNING PRACTICALS\n# Install if required:\n# pip install numpy pandas matplotlib scikit-learn\n\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.pipeline import make_pipeline\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.ensemble import BaggingClassifier\nfrom sklearn.metrics import (\n    accuracy_score, classification_report, confusion_matrix,\n    mean_squared_error, r2_score\n)\n\nnp.random.seed(42)\nclassification_data = []\n\nfor i in range(200):\n    study_hours = np.random.uniform(1, 10)\n    attendance = np.random.uniform(30, 100)\n\n    # A little noise makes the synthetic data less perfectly separable.\n    score = study_hours + attendance / 20 + np.random.normal(0, 0.8)\n    passed = int(score >= 7)\n\n    classification_data.append([study_hours, attendance, passed])\n\nclassification_df = pd.DataFrame(\n    classification_data,\n    columns=[\"StudyHours\", \"Attendance\", \"Passed\"]\n)\n\nX_class = classification_df[[\"StudyHours\", \"Attendance\"]]\ny_class = classification_df[\"Passed\"]\n\nXc_train, Xc_test, yc_train, yc_test = train_test_split(\n    X_class, y_class,\n    test_size=0.2,\n    random_state=42,\n    stratify=y_class\n)\n\ndef plot_actual_vs_predicted(y_true, y_pred, title):\n    actual = np.asarray(y_true)\n    predicted = np.asarray(y_pred)\n\n    plt.figure(figsize=(10, 4))\n\n    plt.subplot(1, 2, 1)\n    plt.scatter(range(len(actual)), actual, edgecolors=\"black\")\n    plt.title(\"Actual Values\")\n    plt.xlabel(\"Sample Number\")\n    plt.ylabel(\"Target\")\n\n    plt.subplot(1, 2, 2)\n    plt.scatter(range(len(predicted)), predicted, edgecolors=\"black\")\n    plt.title(\"Predicted Values\")\n    plt.xlabel(\"Sample Number\")\n    plt.ylabel(\"Target\")\n\n    plt.suptitle(title)\n    plt.tight_layout()\n    plt.show()\n\nbag_model = BaggingClassifier(\n    n_estimators=50,\n    random_state=42\n)\nbag_model.fit(Xc_train, yc_train)\nbag_pred = bag_model.predict(Xc_test)\n\nprint(\"\\n===== BAGGING CLASSIFIER =====\")\nprint(\"Accuracy:\", accuracy_score(yc_test, bag_pred))\nprint(\"Number of estimators:\", len(bag_model.estimators_))\nplot_actual_vs_predicted(\n    yc_test, bag_pred, \"Bagging: Actual vs Predicted\"\n)",

            "Multivariate Linear Regression": "# MACHINE LEARNING PRACTICALS\n# Install if required:\n# pip install numpy pandas matplotlib scikit-learn\n\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.pipeline import make_pipeline\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.linear_model import LogisticRegression, LinearRegression\nfrom sklearn.metrics import (\n    accuracy_score, classification_report, confusion_matrix,\n    mean_squared_error, r2_score\n)\n\n\nnp.random.seed(42)\nregression_data = []\n\nfor i in range(200):\n    study_hours = np.random.uniform(1, 10)\n    attendance = np.random.uniform(30, 100)\n    assignment_marks = np.random.uniform(20, 100)\n\n    final_marks = (\n        4.5 * study_hours\n        + 0.20 * attendance\n        + 0.30 * assignment_marks\n        + np.random.normal(0, 4)\n    )\n    final_marks = np.clip(final_marks, 0, 100)\n\n    regression_data.append(\n        [study_hours, attendance, assignment_marks, final_marks]\n    )\n\nregression_df = pd.DataFrame(\n    regression_data,\n    columns=[\"StudyHours\", \"Attendance\", \"AssignmentMarks\", \"FinalMarks\"]\n)\n\nX_reg = regression_df[[\"StudyHours\", \"Attendance\", \"AssignmentMarks\"]]\ny_reg = regression_df[\"FinalMarks\"]\n\nXr_train, Xr_test, yr_train, yr_test = train_test_split(\n    X_reg, y_reg,\n    test_size=0.2,\n    random_state=42\n)\n\ndef plot_actual_vs_predicted(y_true, y_pred, title):\n    actual = np.asarray(y_true)\n    predicted = np.asarray(y_pred)\n\n    plt.figure(figsize=(10, 4))\n\n    plt.subplot(1, 2, 1)\n    plt.scatter(range(len(actual)), actual, edgecolors=\"black\")\n    plt.title(\"Actual Values\")\n    plt.xlabel(\"Sample Number\")\n    plt.ylabel(\"Target\")\n\n    plt.subplot(1, 2, 2)\n    plt.scatter(range(len(predicted)), predicted, edgecolors=\"black\")\n    plt.title(\"Predicted Values\")\n    plt.xlabel(\"Sample Number\")\n    plt.ylabel(\"Target\")\n\n    plt.suptitle(title)\n    plt.tight_layout()\n    plt.show()\n\nreg_model = LinearRegression()\nreg_model.fit(Xr_train, yr_train)\nreg_pred = reg_model.predict(Xr_test)\n\nprint(\"\\n===== MULTIVARIATE LINEAR REGRESSION =====\")\nprint(\"Mean Squared Error:\", mean_squared_error(yr_test, reg_pred))\nprint(\"R2 Score:\", r2_score(yr_test, reg_pred))\nprint(\"Intercept:\", reg_model.intercept_)\nprint(\"Coefficients:\", reg_model.coef_)\n\nplot_actual_vs_predicted(\n    yr_test, reg_pred, \"Multivariate Linear Regression: Actual vs Predicted\"\n)"
        };

        document.querySelectorAll(".copy-button").forEach((button) => {
            button.addEventListener("click", async () => {
                const code = practicalCodes[button.dataset.code];

                try {
                    await navigator.clipboard.writeText(code);
                } catch (error) {
                    const textarea = document.createElement("textarea");
                    textarea.value = code;
                    textarea.style.position = "fixed";
                    textarea.style.left = "-9999px";

                    document.body.appendChild(textarea);
                    textarea.select();

                    const copied = document.execCommand("copy");
                    textarea.remove();

                    if (!copied) {
                        button.textContent = "Failed";
                        setTimeout(() => button.textContent = "Copy", 1200);
                        return;
                    }
                }

                button.textContent = "Copied";
                setTimeout(() => button.textContent = "Copy", 1200);
            });
        });
    </script>
</body>
</html>
